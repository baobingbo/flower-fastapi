<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="470" fill="#f7f9fc"/>
  <text x="40" y="40" font-size="21" font-weight="700" fill="#1f2d3d">Redis 单机 vs 哨兵（Sentinel）配置</text>
  <text x="40" y="62" font-size="12" fill="#6b7785">后端与 worker 读取同一份 flowerui.runtime.env，切换仅需改两行、重启生效</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6573"/>
    </marker>
  </defs>

  <!-- 中间：runtime.env -->
  <rect x="330" y="86" width="220" height="120" rx="10" fill="#fff" stroke="#1f7a33" stroke-width="1.8"/>
  <text x="440" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1f7a33">flowerui.runtime.env</text>
  <text x="440" y="138" text-anchor="middle" font-size="12" fill="#333">broker_url</text>
  <text x="440" y="160" text-anchor="middle" font-size="12" fill="#333">broker_transport_options</text>
  <text x="440" y="182" text-anchor="middle" font-size="12" fill="#333">result_backend</text>

  <!-- 左：单机 -->
  <rect x="40" y="250" width="360" height="180" rx="10" fill="#fff" stroke="#e8590c" stroke-width="1.6"/>
  <text x="220" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">单机模式</text>
  <rect x="60" y="294" width="320" height="58" rx="6" fill="#fff4ec" stroke="#f0b088"/>
  <text x="220" y="314" text-anchor="middle" font-size="11" fill="#333">broker_url=redis://:密码@127.0.0.1:6379/0</text>
  <text x="220" y="334" text-anchor="middle" font-size="11" fill="#333">result_backend=redis://:密码@127.0.0.1:6379/1</text>
  <text x="220" y="376" text-anchor="middle" font-size="12" fill="#555">transport_options 留空（默认 {}）</text>
  <text x="220" y="398" text-anchor="middle" font-size="12" fill="#555">无需 master_name</text>

  <!-- 右：哨兵 -->
  <rect x="480" y="250" width="360" height="180" rx="10" fill="#fff" stroke="#9c36b5" stroke-width="1.6"/>
  <text x="660" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#7b1fa2">哨兵模式（Sentinel）</text>
  <rect x="500" y="294" width="320" height="58" rx="6" fill="#faf0fb" stroke="#d8a8e6"/>
  <text x="660" y="314" text-anchor="middle" font-size="11" fill="#333">broker_url=sentinel://:密码@h1:p1;h2:p2;h3:p3/0</text>
  <text x="660" y="334" text-anchor="middle" font-size="11" fill="#333">transport_options={"master_name":"xxx"}</text>
  <text x="660" y="376" text-anchor="middle" font-size="12" fill="#555">多个哨兵节点用 ; 分隔，均带 scheme</text>
  <text x="660" y="398" text-anchor="middle" font-size="12" fill="#555">缺 master_name 会显式报错，拒绝静默降级</text>

  <!-- 箭头 env -> 两个模式 -->
  <path d="M380 206 C 320 220, 250 230, 220 246" stroke="#5b6573" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  <path d="M500 206 C 560 220, 630 230, 660 246" stroke="#5b6573" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>

  <!-- 两个模式 -> 后端 + worker -->
  <rect x="40" y="92" width="240" height="64" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.4"/>
  <text x="160" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1a56db">FastAPI 后端</text>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="#555">探测 broker / 查询队列</text>

  <rect x="600" y="92" width="240" height="64" rx="10" fill="#fff" stroke="#e8590c" stroke-width="1.4"/>
  <text x="720" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#c2410c">Celery Worker</text>
  <text x="720" y="138" text-anchor="middle" font-size="11" fill="#555">examples/tasks.py 读同配置</text>

  <path d="M160 156 C 200 175, 300 180, 360 190" stroke="#4285f4" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <path d="M720 156 C 680 175, 520 180, 460 190" stroke="#e8590c" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
</svg>
